apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate
metadata:
  annotations:
    scenarios.ai.sap.com/name: "Team 12 Risk Anomaly"
    executables.ai.sap.com/name: "team12-serve-risk-anomaly"
    executables.ai.sap.com/description: "Serve explainable transaction anomaly scores"
  labels:
    scenarios.ai.sap.com/id: "scenario-risk-anomaly-team12"
    executables.ai.sap.com/id: "st-risk-anomaly-team12"
    ai.sap.com/version: 0.0.1
  name: st-risk-anomaly-team12
spec:
  inputs:
    parameters:
    - name: minreplicas
      default: "1"
      type: string
    artifacts:
    - name: modeluri
  template:
    apiVersion: "serving.kserve.io/v1beta1"
    metadata:
      annotations: |
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/target: 1
        autoscaling.knative.dev/targetBurstCapacity: 0
      labels: |
        ai.sap.com/resourcePlan: starter
    spec: |
          predictor:
            minReplicas: {{inputs.parameters.minreplicas}}
            maxReplicas: 2
            containers:
            - name: kserve-container
              image: mgcxzzz/team12-risk-anomaly:latest
              ports:
              - containerPort: 9001
                protocol: TCP
              env:
              - name: STORAGE_URI
                value: "{{inputs.artifacts.modeluri}}"
