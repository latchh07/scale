<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meridian — Financial Crime Operations · TrustSphere</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Meridian design system — ported verbatim from meridian.html, then extended
   with the components required by the Team 12 risk backend (score composition,
   hard-override banner, model signals, feature snapshot, data-mode switch).
   ========================================================================== */

:root{
  --canvas:#ECEDEA;
  --panel:#F8F8F5;
  --panel-2:#FFFFFF;
  --line:#D9DAD2;
  --line-soft:#E5E6DF;
  --ink:#17191A;
  --ink-2:#54585B;
  --ink-3:#7C8083;
  --accent:#0C5648;
  --accent-deep:#093C33;
  --accent-tint:#0C56480F;
  --crit:#9E2B20;
  --high:#8F5C0E;
  --watch:#2F5875;
  --low:#45623F;
  --focus:#0C5648;
  --r:14px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--canvas);
  color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  min-height:100vh;
}
.mono{font-family:"IBM Plex Mono",monospace;}
.eyebrow{
  font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--ink-3);
  font-weight:500;
}
a{color:var(--accent);}

/* ---------- Masthead ---------- */
.masthead{
  display:flex;align-items:center;justify-content:space-between;
  gap:24px;
  padding:20px 40px;
  border-bottom:1px solid var(--line);
  background:var(--canvas);
  position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:baseline;gap:14px;min-width:0;}
.brand h1{
  font-family:"Bricolage Grotesque",sans-serif;
  font-weight:800;
  font-size:26px;
  letter-spacing:-.02em;
  margin:0;
  line-height:1;
  color:var(--ink);
}
.brand .kicker{
  line-height:1.2;
  border-left:1px solid var(--line);
  padding-left:14px;
}
.brand .kicker span{display:block;}
.masthead .who{
  display:flex;align-items:center;gap:14px;
  text-align:right;
}
.masthead .who .name{font-weight:500;font-size:13.5px;}
.masthead .who .role{font-size:11px;color:var(--ink-2);}
.avatar{
  width:34px;height:34px;border-radius:50%;
  background:var(--accent);color:#fff;
  display:grid;place-items:center;
  font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:500;
  flex:none;
}

/* ---------- Data-mode switch (new) ---------- */
.datamode{
  display:flex;align-items:center;gap:10px;
  padding-right:18px;margin-right:4px;
  border-right:1px solid var(--line);
}
.mode-chip{
  display:inline-flex;align-items:center;gap:7px;
  font-family:"IBM Plex Mono",monospace;font-size:10px;
  letter-spacing:.08em;text-transform:uppercase;font-weight:500;
  border:1px solid var(--line);border-radius:100px;padding:5px 11px;
  background:var(--panel-2);color:var(--ink-2);cursor:pointer;
  transition:all .25s var(--ease);font-family:"IBM Plex Mono",monospace;
}
.mode-chip:hover{border-color:var(--ink-3);color:var(--ink);}
.mode-chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
.mode-chip .lamp{width:6px;height:6px;border-radius:50%;background:var(--ink-3);flex:none;}
.mode-chip.live{border-color:var(--accent);color:var(--accent);}
.mode-chip.live .lamp{background:var(--accent);animation:pulse 2.4s var(--ease) infinite;}
.mode-note{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3);letter-spacing:.04em;}

/* ---------- Workbench grid (asymmetric) ---------- */
.workbench{
  display:grid;
  grid-template-columns:minmax(300px,340px) minmax(0,1fr) minmax(340px,400px);
  gap:0;
  min-height:calc(100vh - 74px);
}
.queue{border-right:1px solid var(--line);padding:28px 26px 40px;}
.case{padding:40px 48px 56px;min-width:0;}
.assistant{border-left:1px solid var(--line);background:var(--panel);padding:28px 26px 40px;}

/* ---------- Queue rail ---------- */
.queue-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;}
.queue-head h2{
  font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:19px;
  margin:14px 0 2px;letter-spacing:-.01em;
}
.queue-sub{font-size:12.5px;color:var(--ink-2);margin-bottom:18px;}
.queue-sub b{color:var(--ink);font-weight:600;}
.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px;}
.pill{
  font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  padding:6px 11px;border-radius:100px;border:1px solid var(--line);
  background:transparent;color:var(--ink-2);cursor:pointer;
  transition:all .25s var(--ease);
}
.pill:hover{border-color:var(--ink-3);color:var(--ink);}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;}
.pill:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
.qrow{
  position:relative;
  display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;
  padding:14px 16px 14px 15px;
  background:var(--panel-2);
  border:1px solid var(--line-soft);
  border-radius:12px;
  cursor:pointer;
  transition:transform .3s var(--ease),border-color .3s var(--ease),box-shadow .3s var(--ease);
  text-align:left;width:100%;font-family:inherit;
}
.qrow::before{
  content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;
  background:var(--tier);opacity:0;transform:scaleY(.3);transform-origin:center;
  transition:opacity .3s var(--ease),transform .3s var(--ease);
}
.qrow:hover{transform:translateX(3px);border-color:var(--line);box-shadow:0 6px 20px -14px rgba(0,0,0,.35);}
.qrow:hover::before{opacity:1;transform:scaleY(1);}
.qrow[aria-current="true"]{border-color:var(--ink);box-shadow:0 8px 26px -16px rgba(0,0,0,.4);}
.qrow[aria-current="true"]::before{opacity:1;transform:scaleY(1);left:0;width:4px;}
.qrow:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
.qscore{
  font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:30px;
  line-height:.9;letter-spacing:-.03em;color:var(--tier);min-width:52px;
}
.qmeta .qtop{display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap;}
.qid{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink);font-weight:500;}
.qmeta{display:block;min-width:0;}
.qmeta .qdesc{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.35;overflow-wrap:anywhere;}
.qmeta .qfoot{display:block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);margin-top:4px;letter-spacing:.03em;overflow-wrap:anywhere;}
.tier-chip{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;
  padding:3px 8px;border-radius:5px;color:#fff;background:var(--tier);
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
}
.tier-chip .glyph{width:6px;height:6px;background:#fff;display:inline-block;}
.tier-chip.t-crit .glyph{clip-path:polygon(50% 0,100% 100%,0 100%);}
.tier-chip.t-high .glyph{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);}
.tier-chip.t-watch .glyph{border-radius:50%;}
.tier-chip.t-low .glyph{}
/* hard-override marker on a queue row (new) */
.ovr-mark{
  font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;
  padding:3px 7px;border-radius:5px;
  border:1px solid var(--crit);color:var(--crit);background:#9E2B200A;
  white-space:nowrap;
}

/* ---------- Case panel ---------- */
.case-eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
.case-eyebrow .rule{height:1px;background:var(--line);flex:1;}

.score-block{display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap;margin-bottom:6px;}
.composite{
  font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
  font-size:clamp(84px,11vw,148px);line-height:.82;letter-spacing:-.045em;
  color:var(--ink);position:relative;
}
.composite .outof{font-size:.2em;color:var(--ink-3);font-weight:600;letter-spacing:0;margin-left:.1em;}
.score-side{padding-bottom:14px;}
.score-side .tierline{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.tier-band{
  font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:22px;color:var(--tier);letter-spacing:-.01em;
}
.formula{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);line-height:1.5;max-width:300px;}
.formula b{color:var(--ink-2);font-weight:600;}

.case-facts{
  display:grid;grid-template-columns:repeat(4,auto);gap:26px 40px;
  padding:22px 0;margin:26px 0 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  justify-content:start;
}
.fact .flabel{font-size:11px;color:var(--ink-3);letter-spacing:.02em;margin-bottom:4px;}
.fact .fval{font-family:"IBM Plex Mono",monospace;font-size:14.5px;color:var(--ink);font-weight:500;}
.fact .fval.small{font-size:13px;}
.fact .fval.dim{color:var(--ink-3);}

.flags{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 34px;}
.flag{
  font-size:11.5px;font-weight:500;padding:5px 11px;border-radius:100px;
  border:1px solid var(--crit);color:var(--crit);background:#9E2B200A;
  display:inline-flex;align-items:center;gap:6px;
}
.flag .dot{width:5px;height:5px;border-radius:50%;background:var(--crit);}
.flag.muted{border-color:var(--line);color:var(--ink-3);background:transparent;}
.flag.muted .dot{background:var(--ink-3);}

/* ---------- Hard-override banner (new) ---------- */
.override{
  display:flex;gap:14px;align-items:flex-start;
  padding:15px 17px;border-radius:12px;margin:0 0 26px;
  border:1px solid var(--crit);background:#9E2B200A;
}
.override .mark{
  width:24px;height:24px;border-radius:6px;flex:none;
  background:var(--crit);color:#fff;display:grid;place-items:center;
  font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;
}
.override .otxt{font-size:12.5px;line-height:1.55;color:var(--ink);}
.override .otxt b{font-weight:600;color:var(--crit);}
.override .otxt ul{margin:7px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;}
.override .otxt li{color:var(--ink-2);font-size:12px;display:flex;gap:8px;}
.override .otxt li .rid{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--crit);flex:none;}

/* ---------- Ledger ---------- */
.ledger-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;gap:16px;}
.ledger-head h3{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:17px;margin:0;letter-spacing:-.01em;}
.ledger-head .hint{font-size:11.5px;color:var(--ink-3);text-align:right;}
.ledger{display:flex;flex-direction:column;gap:2px;}
.ledger + .ledger-head{margin-top:34px;}
.frow{
  display:grid;grid-template-columns:230px 1fr 130px;gap:20px;align-items:center;
  padding:11px 0;border-bottom:1px dashed var(--line-soft);
}
.frow:last-child{border-bottom:none;}
.fname{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink);}
.wbadge{
  font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:500;color:var(--ink-2);
  border:1px solid var(--line);border-radius:5px;padding:2px 5px;flex:none;
}
.wbadge.pts{color:var(--accent);border-color:var(--accent);}
.track{height:8px;background:#0C56481A;border-radius:100px;overflow:hidden;}
.fill{height:100%;width:0;background:var(--accent);border-radius:100px;transition:width .9s var(--ease);}
.rank1 .fill{background:var(--accent-deep);}
.frow.dim .fname{color:var(--ink-3);}
.frow.dim .fill{background:var(--ink-3);}
.ffig{font-family:"IBM Plex Mono",monospace;font-size:12.5px;text-align:right;color:var(--ink-2);}
.ffig b{color:var(--ink);font-weight:600;}
.ffig .contrib{color:var(--accent);}
.ledger-empty{font-size:12.5px;color:var(--ink-3);padding:12px 0;font-style:italic;}

/* ---------- Model signals (new) ---------- */
.signals{
  margin-top:34px;padding:20px 22px;border-radius:12px;
  border:1px solid var(--line);background:var(--panel);
}
.signals .shead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
.signals h3{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:16px;margin:0;letter-spacing:-.01em;}
.signals .sver{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);letter-spacing:.04em;}
.band-chip{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:5px;
  color:#fff;background:var(--ink-3);
}
.band-chip.b-high{background:var(--crit);}
.band-chip.b-medium{background:var(--high);}
.band-chip.b-low{background:var(--low);}
.deviations{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;}
.deviations li{
  font-size:12.5px;color:var(--ink-2);display:flex;gap:10px;align-items:flex-start;line-height:1.45;
}
.deviations li .idx{
  font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--accent);flex:none;margin-top:2px;
}
.signals.unavailable{border-style:dashed;background:transparent;}
.signals .fallback{font-size:12.5px;color:var(--ink-2);line-height:1.55;margin:0;}
.signals .fallback b{color:var(--ink);font-weight:600;}

/* ---------- Feature snapshot (new) ---------- */
.snapshot{margin-top:20px;}
.snapshot summary{
  cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  padding:8px 0;list-style:none;transition:color .25s var(--ease);
}
.snapshot summary::-webkit-details-marker{display:none;}
.snapshot summary::before{content:"+ ";color:var(--accent);}
.snapshot[open] summary::before{content:"– ";}
.snapshot summary:hover{color:var(--ink);}
.snapshot summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
.fgrid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 26px;
  padding:16px 0 6px;
}
.fcell .fk{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3);letter-spacing:.04em;margin-bottom:3px;}
.fcell .fv{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink);font-weight:500;}
.fcell .fv.on{color:var(--crit);}
.fcell .fv.off{color:var(--ink-3);}

/* ---------- Assistant ---------- */
.assistant h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:19px;margin:14px 0 4px;letter-spacing:-.01em;}
.assistant .asub{font-size:12.5px;color:var(--ink-2);margin-bottom:18px;}
.joule-badge{
  display:inline-flex;align-items:center;gap:7px;font-family:"IBM Plex Mono",monospace;
  font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);
  border:1px solid var(--accent);border-radius:100px;padding:4px 10px;margin-bottom:8px;
}
.joule-badge .pulse{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2.4s var(--ease) infinite;}
@keyframes pulse{0%,100%{opacity:.35;}50%{opacity:1;}}

.actions{display:flex;flex-direction:column;gap:9px;margin-bottom:22px;}
.act{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:13px 16px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--ink);font-family:inherit;font-size:13.5px;font-weight:500;
  cursor:pointer;text-align:left;width:100%;
  transition:transform .28s var(--ease),border-color .28s var(--ease),box-shadow .28s var(--ease),background .28s var(--ease);
}
.act .arrow{color:var(--accent);transition:transform .28s var(--ease);font-family:"IBM Plex Mono",monospace;}
.act:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 10px 24px -18px rgba(12,86,72,.9);}
.act:hover .arrow{transform:translateX(3px);}
.act:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
.act:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none;border-color:var(--line-soft);}
.act[data-done="true"]{border-color:var(--accent);background:var(--accent-tint);}

.thread{display:flex;flex-direction:column;gap:14px;}
.msg{
  background:var(--panel-2);border:1px solid var(--line-soft);border-radius:12px;
  padding:15px 16px;opacity:0;transform:translateY(8px);
  transition:opacity .5s var(--ease),transform .5s var(--ease);
}
.msg.in{opacity:1;transform:none;}
.msg .mhead{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:9px;display:flex;align-items:center;gap:7px;}
.msg .mhead .src{margin-left:auto;color:var(--ink-3);letter-spacing:.04em;}
.msg p{margin:0 0 9px;font-size:13.5px;line-height:1.55;color:var(--ink);}
.msg p:last-child{margin-bottom:0;}
.msg ul{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;}
.msg li{font-size:12.5px;color:var(--ink-2);display:flex;gap:9px;align-items:flex-start;line-height:1.45;}
.msg li .tick{color:var(--accent);font-family:"IBM Plex Mono",monospace;flex:none;margin-top:1px;}
.draft{width:100%;min-height:118px;resize:vertical;border:1px solid var(--line);border-radius:10px;
  padding:12px 13px;font-family:"IBM Plex Sans",sans-serif;font-size:13px;line-height:1.55;color:var(--ink);background:#fff;
  transition:border-color .25s var(--ease);}
.draft:focus-visible{outline:none;border-color:var(--accent);}
.signoff{display:flex;gap:9px;margin-top:11px;}
.btn{
  font-family:inherit;font-size:13px;font-weight:500;border-radius:9px;padding:10px 16px;cursor:pointer;
  transition:transform .25s var(--ease),background .25s var(--ease),box-shadow .25s var(--ease);border:1px solid transparent;
}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{transform:translateY(-2px);background:var(--accent-deep);box-shadow:0 12px 26px -16px rgba(12,86,72,.95);}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line);}
.btn-ghost:hover{border-color:var(--ink-3);}
.confirmed{
  display:flex;align-items:center;gap:11px;margin-top:12px;padding:13px 15px;border-radius:11px;
  background:var(--accent-tint);border:1px solid var(--accent);
}
.confirmed.pending{background:transparent;border-style:dashed;}
.confirmed .chk{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;flex:none;}
.confirmed.pending .chk{background:var(--ink-2);}
.confirmed .ctxt{font-size:12.5px;color:var(--ink);}
.confirmed .ctxt b{font-weight:600;}
.confirmed .ctxt .mono{color:var(--ink-2);}

.accountability{
  margin-top:26px;padding:14px 16px;border-radius:11px;
  background:transparent;border:1px dashed var(--line);
  font-size:12px;line-height:1.55;color:var(--ink-2);
}
.accountability b{color:var(--ink);font-weight:600;}

/* ---------- Loading / empty / error states (new) ---------- */
.state{
  display:flex;flex-direction:column;align-items:flex-start;gap:10px;
  padding:56px 0;max-width:520px;
}
.state h3{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:20px;margin:0;letter-spacing:-.01em;}
.state p{font-size:13.5px;color:var(--ink-2);line-height:1.6;margin:0;}
.state code{font-family:"IBM Plex Mono",monospace;font-size:12px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:5px;padding:2px 6px;}
.skeleton{
  height:12px;border-radius:100px;background:linear-gradient(90deg,var(--line-soft),var(--panel-2),var(--line-soft));
  background-size:200% 100%;animation:shimmer 1.4s linear infinite;
}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .workbench{grid-template-columns:minmax(280px,320px) 1fr;}
  .assistant{grid-column:1 / -1;border-left:none;border-top:1px solid var(--line);}
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media (max-width:820px){
  .workbench{grid-template-columns:1fr;}
  .queue{border-right:none;border-bottom:1px solid var(--line);}
  .case{padding:32px 24px 40px;}
  .masthead{padding:16px 22px;flex-wrap:wrap;gap:14px;}
  .case-facts{grid-template-columns:repeat(2,auto);}
  .frow{grid-template-columns:150px 1fr 104px;gap:12px;}
  .brand .kicker{display:none;}
  .datamode{border-right:none;padding-right:0;}
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important;}
  .fill{transition:none !important;}
}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:50;}
.skip:focus{left:16px;top:12px;}

/* ---------- Live feed (new) ---------- */
.new-mark{
  font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;
  padding:3px 7px;border-radius:5px;
  border:1px solid var(--accent);color:var(--accent);background:var(--accent-tint);
  white-space:nowrap;
}
.qrow.is-new{
  animation:arrive .6s var(--ease) both;
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-tint);
}
@keyframes arrive{
  from{opacity:0;transform:translateY(-8px) scale(.985);}
  to{opacity:1;transform:none;}
}
.feed-note{
  display:flex;align-items:center;gap:8px;
  margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);
}
.feed-note .lamp{
  width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;
  animation:pulse 2.4s var(--ease) infinite;
}

/* ---------- Degradation banner (new) ---------- */
.degraded{
  display:flex;align-items:flex-start;gap:14px;
  padding:14px 40px;
  border-bottom:1px solid var(--line);
  background:var(--panel);
}
.degraded.severe{
  background:#9E2B200A;
  border-bottom-color:var(--crit);
}
.degraded .dmark{
  width:22px;height:22px;border-radius:6px;flex:none;margin-top:1px;
  background:var(--ink-3);color:#fff;display:grid;place-items:center;
  font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;
}
.degraded.severe .dmark{background:var(--crit);}
.degraded .dtxt{min-width:0;flex:1;}
.degraded .dtitle{
  font-size:13.5px;font-weight:600;color:var(--ink);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.degraded.severe .dtitle{color:var(--crit);}
.degraded .dtag{
  font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:500;
  letter-spacing:.08em;text-transform:uppercase;
  padding:3px 7px;border-radius:5px;
  border:1px solid var(--line);color:var(--ink-3);background:var(--panel-2);
}
.degraded .ddetail,.degraded .dremedy{
  margin:4px 0 0;font-size:12.5px;line-height:1.5;color:var(--ink-2);
}
.degraded .dremedy{color:var(--ink-3);}
.degraded code{
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;
  background:var(--panel-2);border:1px solid var(--line-soft);
  border-radius:4px;padding:1px 5px;
}
.degraded .ddismiss{
  flex:none;background:transparent;border:none;cursor:pointer;
  color:var(--ink-3);font-size:20px;line-height:1;padding:0 2px;
  transition:color .25s var(--ease);
}
.degraded .ddismiss:hover{color:var(--ink);}
.degraded .ddismiss:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
@media (max-width:820px){
  .degraded{padding:14px 22px;}
}

/* ---------- Joule agent chat (new) ---------- */
.joule-badge.offline{color:var(--ink-3);border-color:var(--line);}
.joule-badge.offline .pulse{background:var(--ink-3);animation:none;}

.askbar{display:flex;gap:8px;margin:0 0 20px;}
.askinput{
  flex:1;min-width:0;
  font-family:"IBM Plex Sans",sans-serif;font-size:13px;color:var(--ink);
  background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
  padding:10px 12px;transition:border-color .25s var(--ease);
}
.askinput::placeholder{color:var(--ink-3);}
.askinput:focus-visible{outline:none;border-color:var(--accent);}
.askinput:disabled{opacity:.55;}
.asksend{flex:none;}
.asksend:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none;}

.askedq{
  font-family:"IBM Plex Mono",monospace;font-size:11px;line-height:1.5;
  color:var(--ink-3);border-left:2px solid var(--line);
  padding-left:10px;margin:0 0 12px !important;
}
.seclabel{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:5px;
}
.agent-error{color:var(--crit) !important;font-size:12.5px !important;}

.agent-factors{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line-soft);}
.frow.agent-frow{
  grid-template-columns:132px 1fr 62px;gap:12px;padding:8px 0;
  border-bottom:none;cursor:help;
}
.frow.agent-frow .fname{font-size:12px;gap:8px;}
.frow.agent-frow .ffig{font-size:11px;}
.frow.agent-frow .track{height:6px;}

.agent-rec{
  margin-top:14px;padding:11px 13px;border-radius:10px;
  background:var(--accent-tint);border:1px solid var(--accent);
}
.agent-rec .reclabel{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--accent);display:block;margin-bottom:4px;
}
.agent-rec p{margin:0 !important;font-size:12.5px !important;line-height:1.5 !important;}

/* ---------- Independent column scrolling (new) ----------------------------
   On a desktop-width screen the workbench becomes a fixed app shell: the
   masthead and any degradation banner stay put, and each column scrolls on its
   own. A long triage queue no longer drags the case panel out of view, and a
   long assistant thread no longer moves the queue.

   Below 1180px the layout reflows to one or two columns, where a single page
   scroll is the correct behaviour, so the shell is switched off.
   ------------------------------------------------------------------------ */
@media (min-width:1181px){
  html,body{height:100%;overflow:hidden;}
  #root{height:100%;display:flex;flex-direction:column;}

  .masthead{position:static;flex:none;}
  .degraded{flex:none;}

  .workbench{flex:1 1 auto;min-height:0;}

  .queue,.case,.assistant{
    overflow-y:auto;
    overflow-x:hidden;
    min-height:0;
    scrollbar-gutter:stable;
    overscroll-behavior:contain;   /* stop one column's scroll bleeding into another */
  }

  /* Quiet scrollbars, in the Meridian palette rather than the OS default. */
  .queue,.case,.assistant{scrollbar-width:thin;scrollbar-color:var(--line) transparent;}
  .queue::-webkit-scrollbar,
  .case::-webkit-scrollbar,
  .assistant::-webkit-scrollbar{width:11px;}
  .queue::-webkit-scrollbar-track,
  .case::-webkit-scrollbar-track,
  .assistant::-webkit-scrollbar-track{background:transparent;}
  .queue::-webkit-scrollbar-thumb,
  .case::-webkit-scrollbar-thumb,
  .assistant::-webkit-scrollbar-thumb{
    background:var(--line);
    border-radius:100px;
    border:3px solid transparent;
    background-clip:content-box;
  }
  .queue:hover::-webkit-scrollbar-thumb,
  .case:hover::-webkit-scrollbar-thumb,
  .assistant:hover::-webkit-scrollbar-thumb{background:var(--ink-3);background-clip:content-box;}

  /* The filter pills stay reachable while scrolling a long queue. Full-bleed
     across the rail's padding so cards cannot show past their edges. */
  .queue .filters{
    position:sticky;top:0;z-index:3;
    background:var(--canvas);
    margin:0 -26px 12px;
    padding:10px 26px 12px;
    border-bottom:1px solid var(--line);
  }

}

/* ---------- Cleared-alert note (new) ---------- */
.cleared-note{
  margin-top:14px;font-size:11.5px;line-height:1.5;color:var(--ink-3);
  padding-top:12px;border-top:1px dashed var(--line-soft);
}

/* ---------- Analyst decision (new) ---------- */
.case-actions{
  position:sticky;bottom:0;z-index:4;
  display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
  margin:34px -48px 0;
  padding:16px 48px;
  background:var(--panel-2);
  border-top:1px solid var(--line);
  box-shadow:0 -10px 24px -22px rgba(0,0,0,.5);
}
.case-actions .ca-label{
  display:block;
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:3px;
}
.case-actions .ca-detail{
  font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);
}
.case-actions .ca-buttons{display:flex;gap:9px;flex:none;}

.btn-approve{background:var(--accent);color:#fff;}
.btn-approve:hover{transform:translateY(-2px);background:var(--accent-deep);box-shadow:0 12px 26px -16px rgba(12,86,72,.95);}
.btn-decline{background:transparent;color:var(--crit);border-color:var(--crit);}
.btn-decline:hover{transform:translateY(-2px);background:var(--crit);color:#fff;box-shadow:0 12px 26px -16px rgba(158,43,32,.9);}

/* ---------- Decision confirmation ---------- */
.resolved{
  display:flex;align-items:center;gap:14px;
  padding:12px 40px;
  border-bottom:1px solid var(--line);
  background:var(--panel);
}
.resolved.approve{background:var(--accent-tint);border-bottom-color:var(--accent);}
.resolved.decline{background:#9E2B200A;border-bottom-color:var(--crit);}
.resolved .rmark{
  width:22px;height:22px;border-radius:50%;flex:none;
  display:grid;place-items:center;font-size:12px;color:#fff;
}
.resolved.approve .rmark{background:var(--accent);}
.resolved.decline .rmark{background:var(--crit);}
.resolved .rtxt{flex:1;min-width:0;font-size:13px;color:var(--ink);}
.resolved .rmuted{color:var(--ink-3);}
.resolved .rundo{
  flex:none;font-family:inherit;font-size:12.5px;font-weight:500;cursor:pointer;
  background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 14px;
  color:var(--ink);transition:border-color .25s var(--ease),background .25s var(--ease);
}
.resolved .rundo:hover{border-color:var(--ink);background:var(--panel-2);}
.resolved .rundo:focus-visible,.resolved .rdismiss:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
.resolved .rdismiss{
  flex:none;background:transparent;border:none;cursor:pointer;
  color:var(--ink-3);font-size:20px;line-height:1;padding:0 2px;
}
.resolved .rdismiss:hover{color:var(--ink);}

@media (max-width:820px){
  .case-actions{margin:28px -24px 0;padding:14px 24px;}
  .resolved{padding:12px 22px;}
}
@media (min-width:1181px){
  /* The case column scrolls on its own, so the bar pins to its bottom edge. */
  .case{padding-bottom:0;}
}

/* ==========================================================================
   Assistant as a chat
   Header stays put, the log scrolls, the composer is pinned to the bottom —
   the arrangement every messaging interface uses, so it needs no explaining.
   ========================================================================== */
.assistant{display:flex;flex-direction:column;min-height:0;}
.chat-head{flex:none;padding-bottom:14px;border-bottom:1px solid var(--line);}
.chat-head h2{margin:10px 0 0;}

.chat-log{
  flex:1 1 auto;min-height:0;overflow-y:auto;
  padding:16px 0 6px;
  display:flex;flex-direction:column;gap:12px;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;
  overscroll-behavior:contain;
}
.chat-log::-webkit-scrollbar{width:9px;}
.chat-log::-webkit-scrollbar-track{background:transparent;}
.chat-log::-webkit-scrollbar-thumb{
  background:var(--line);border-radius:100px;
  border:2px solid transparent;background-clip:content-box;
}
.chat-log:hover::-webkit-scrollbar-thumb{background:var(--ink-3);background-clip:content-box;}

.chat-note{
  margin:0;font-size:12.5px;line-height:1.55;color:var(--ink-3);
}
.chat-empty{display:flex;flex-direction:column;gap:14px;}

/* ---- suggested prompts ---- */
.chip-row{display:flex;flex-wrap:wrap;gap:7px;}
.chip{
  font-family:inherit;font-size:12.5px;font-weight:500;
  padding:8px 13px;border-radius:100px;
  border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
  cursor:pointer;text-align:left;
  transition:border-color .25s var(--ease),transform .25s var(--ease),background .25s var(--ease);
}
.chip:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px);}
.chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
.chip:disabled{opacity:.45;cursor:default;transform:none;}
.chip-row.compact .chip{font-size:11.5px;padding:6px 11px;}

/* ---- turns ---- */
.turn{display:flex;}
.turn.user{justify-content:flex-end;}
.turn.agent{justify-content:flex-start;}

.bubble-user{
  max-width:86%;
  background:var(--accent);color:#fff;
  border-radius:14px 14px 4px 14px;
  padding:10px 14px;
  font-size:13px;line-height:1.5;
}
.bubble-agent{
  max-width:97%;
  background:var(--panel-2);
  border:1px solid var(--line-soft);
  border-radius:14px 14px 14px 4px;
  padding:13px 15px;
}
.bubble-agent .ag-head{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);
  margin-bottom:9px;display:flex;align-items:center;gap:7px;
}
.bubble-agent .ag-head .src{margin-left:auto;color:var(--ink-3);letter-spacing:.04em;}
.bubble-agent .ag-title{
  font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:14.5px;
  color:var(--ink);margin-bottom:9px;line-height:1.35;
}
.bubble-agent .ag-section{margin-bottom:10px;}
.bubble-agent .ag-section:last-of-type{margin-bottom:0;}
.bubble-agent p{margin:0;font-size:12.5px;line-height:1.55;color:var(--ink-2);}

/* ---- thinking ---- */
.typing{display:flex;gap:5px;padding:3px 0 1px;}
.typing span{
  width:6px;height:6px;border-radius:50%;background:var(--ink-3);
  animation:blink 1.3s var(--ease) infinite;
}
.typing span:nth-child(2){animation-delay:.18s;}
.typing span:nth-child(3){animation-delay:.36s;}
@keyframes blink{0%,60%,100%{opacity:.25;}30%{opacity:1;}}

/* ---- composer ---- */
.chat-foot{
  flex:none;padding-top:12px;border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:9px;
}
.composer{display:flex;gap:8px;}
.chat-foot-note{
  margin:0;font-size:10.5px;line-height:1.5;color:var(--ink-3);
}

/* Desktop: the panel itself no longer scrolls — the log does. */
@media (min-width:1181px){
  .assistant{overflow:hidden;}
}
/* Narrow: let the page scroll and give the log room to breathe. */
@media (max-width:1180px){
  .assistant{max-height:none;}
  .chat-log{max-height:60vh;}
}
